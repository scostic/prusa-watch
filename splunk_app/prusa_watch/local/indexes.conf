# Prusa Watch events (HEC, sourcetype prusa:watch). Low volume: ~60 small events per print-hour.
[prusa_watch]
homePath   = $SPLUNK_DB/prusa_watch/db
coldPath   = $SPLUNK_DB/prusa_watch/colddb
thawedPath = $SPLUNK_DB/prusa_watch/thaweddb
datatype = event
# 10 GB cap and 2-year retention - far more than this workload will ever need.
maxTotalDataSizeMB = 10240
frozenTimePeriodInSecs = 63072000
