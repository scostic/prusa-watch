# Events arrive via HEC (/services/collector/event) with "time" set by the add-on.
[prusa:watch]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 20000
category = Custom
description = Prusa Watch add-on events: check, state, email, error

# Rough Bedrock cost per check (Claude Haiku 4.5, EU cross-region profile).
# Adjust to your price list: USD per 1M tokens.
EVAL-cost_usd = if(isnotnull(input_tokens), round(input_tokens*1.10/1000000 + output_tokens*5.50/1000000, 6), null())
