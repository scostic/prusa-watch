# Events arrive via HEC (/services/collector/event) with "time" set by the add-on.
[prusa:watch]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 20000
category = Custom
description = Prusa Watch add-on events: check, state, email, error

# Cost per check: the add-on sends cost_usd (0.8.0+, per model); older events fall back to Haiku 4.5 on Bedrock EU.
# Adjust to your price list: USD per 1M tokens.
EVAL-cost_usd = coalesce(cost_usd, if(isnotnull(input_tokens), round(input_tokens*1.10/1000000 + output_tokens*5.50/1000000, 6), null()))
